<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso ao Painel | Radar São José</title>
  <link rel="icon" type="image/png" href="fotos radar/logo.png" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#F0F7FF',
              100: '#E0EFFE',
              200: '#BAE0FD',
              300: '#7CC8FB',
              400: '#38ACF8',
              500: '#0EA5E9',
              600: '#0284C7',
              700: '#0369A1',
              800: '#075985',
              900: '#0B2545',
              950: '#07172C',
            },
            surface: {
              bg: '#F8FAFC',
              card: '#FFFFFF',
              border: '#E2E8F0',
            }
          },
          boxShadow: {
            'card': '0 4px 20px -2px rgba(11, 37, 69, 0.05), 0 2px 6px -1px rgba(11, 37, 69, 0.02)',
            'card-hover': '0 12px 30px -4px rgba(11, 37, 69, 0.10), 0 4px 10px -2px rgba(11, 37, 69, 0.04)',
            'brand-glow': '0 0 25px rgba(0, 180, 216, 0.3)',
          }
        }
      }
    }
  </script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #F8FAFC;
      color: #1E293B;
    }
    .view-transition {
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Slideshow Dinâmico Original com Transição Suave das Fotos de SJC */
    .login-bg-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.05);
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 4s ease-out;
      will-change: opacity, transform;
    }
    .login-bg-slide.active {
      opacity: 0.85;
      transform: scale(1);
    }
  </style>
</head>
<body class="min-h-screen bg-surface-bg antialiased selection:bg-brand-500 selection:text-white flex flex-col justify-between">

  <!-- 1. TELA DE LOGIN ORIGINAL (SLIDESHOW COM FOTOS DINÂMICAS DE SÃO JOSÉ DOS CAMPOS) -->
  <main id="login-screen" class="view-transition min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 relative overflow-hidden bg-slate-950">
    
    <!-- Slideshow Original de Fundo com as Fotos Oficiais de São José -->
    <div id="login-slideshow" class="absolute inset-0 z-0 pointer-events-none">
      <div class="login-bg-slide active" style="background-image: url('fotos radar/foto_onibus_viaduto.jpg'); background-position: center 35%;"></div>
      <div class="login-bg-slide" style="background-image: url('fotos radar/foto_cidade.jpg'); background-position: center center;"></div>
      <div class="login-bg-slide" style="background-image: url('fotos radar/foto_cultura.jpg'); background-position: center center;"></div>
      <div class="login-bg-slide" style="background-image: url('fotos radar/foto_gastronomia.jpg'); background-position: center center;"></div>
      <div class="login-bg-slide" style="background-image: url('fotos radar/foto_noite.jpg'); background-position: center center;"></div>
      <div class="login-bg-slide" style="background-image: url('fotos radar/foto_pessoas.jpg'); background-position: center center;"></div>
    </div>

    <!-- Overlay Gradiente Corporativo Original -->
    <div class="absolute inset-0 z-0 bg-gradient-to-t from-brand-950/90 via-brand-950/50 to-brand-950/75 pointer-events-none"></div>

    <!-- Card Branco Original -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-100/20 p-8 sm:p-10 relative z-10 backdrop-blur-lg">
      
      <!-- Topo do Card com Logo Oficial -->
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center mb-3">
          <img 
            src="fotos radar/logo_login_oficial.png?v=3" 
            alt="Radar São José" 
            class="h-16 sm:h-20 max-w-[260px] object-contain drop-shadow-xs"
            onerror="this.src='fotos radar/logo.png'"
          />
        </div>
        <h1 class="text-2xl font-black tracking-tight text-brand-900">Dashboard Executivo</h1>
        <p class="text-xs font-semibold text-slate-500 mt-1 uppercase tracking-widest">Inteligência & Análise 2026/2027</p>
      </div>

      <!-- Abas Limpas: Entrar vs Novo Usuário -->
      <div class="flex p-1 bg-slate-100 rounded-xl mb-5 text-xs font-bold uppercase tracking-wider">
        <button id="tabEntrarBtn" onclick="setAuthMode('login')" class="flex-1 py-2 rounded-lg bg-brand-900 text-white shadow-xs text-center transition-all">
          Entrar
        </button>
        <button id="tabNovoBtn" onclick="setAuthMode('register')" class="flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-900 text-center transition-all">
          Novo Usuário
        </button>
      </div>

      <!-- Botão Oficial: Entrar com o Google -->
      <div class="mb-5">
        <button type="button" onclick="loginWithGoogle()" class="w-full py-3 px-4 bg-white hover:bg-slate-50 active:scale-[0.99] text-slate-700 font-bold rounded-xl text-xs uppercase tracking-wider border border-slate-300 shadow-xs hover:shadow-sm transition-all duration-200 flex items-center justify-center gap-3">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span id="googleBtnLabel">Entrar com o Google</span>
        </button>

        <div class="relative flex items-center justify-center my-4">
          <div class="border-t border-slate-200 w-full"></div>
          <span class="bg-white px-3 text-[10px] font-bold uppercase tracking-widest text-slate-400 absolute">
            ou preencha os dados
          </span>
        </div>
      </div>

      <div id="login-error-alert" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold border transition-all"></div>

      <!-- Formulário de Login (Original) -->
      <form id="login-form" class="space-y-4" onsubmit="handleAuthSubmit(event); return false;">
        
        <!-- Campo Nome (Apenas no Modo Novo Usuário) -->
        <div id="field-nome" class="hidden">
          <label for="nome" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
            Nome Completo
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-regular fa-user"></i>
            </div>
            <input 
              type="text" 
              id="nome" 
              placeholder="Seu nome completo" 
              class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-600 transition-all"
            />
          </div>
        </div>

        <div>
          <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
            E-mail Institucional / Pessoal
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-regular fa-envelope"></i>
            </div>
            <input 
              type="email" 
              id="email" 
              required 
              placeholder="seu.email@exemplo.com" 
              class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-600 transition-all"
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
            Senha de Acesso
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-lock"></i>
            </div>
            <input 
              type="password" 
              id="password" 
              required 
              placeholder="••••••••" 
              class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-600 transition-all"
            />
            <button 
              type="button" 
              id="toggle-password" 
              onclick="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none"
            >
              <i class="fa-regular fa-eye" id="toggle-password-icon"></i>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="btn-login" 
          class="w-full py-3.5 px-4 bg-brand-900 hover:bg-brand-800 active:scale-[0.99] text-white font-bold rounded-xl text-sm shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2 mt-4"
        >
          <span id="btn-login-text">Entrar no Painel</span>
          <i id="btn-login-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-100 text-center text-[11px] text-slate-400 font-medium">
        &copy; <span id="year-current">2026</span> Radar São José. Todos os direitos reservados.
      </div>
    </div>
  </main>

  <script>
    // Slideshow de Fundo Original com transição contínua
    let currentSlideIdx = 0;
    const slides = document.querySelectorAll(".login-bg-slide");
    if (slides && slides.length > 1) {
      setInterval(() => {
        slides[currentSlideIdx].classList.remove("active");
        currentSlideIdx = (currentSlideIdx + 1) % slides.length;
        slides[currentSlideIdx].classList.add("active");
      }, 4000);
    }

    let authMode = 'login';

    function setAuthMode(mode) {
      authMode = mode;
      const tabEntrar = document.getElementById('tabEntrarBtn');
      const tabNovo = document.getElementById('tabNovoBtn');
      const fieldNome = document.getElementById('field-nome');
      const btnText = document.getElementById('btn-login-text');
      const googleLabel = document.getElementById('googleBtnLabel');

      if (mode === 'login') {
        tabEntrar.className = "flex-1 py-2 rounded-lg bg-brand-900 text-white shadow-xs text-center transition-all";
        tabNovo.className = "flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-900 text-center transition-all";
        fieldNome.classList.add('hidden');
        btnText.innerText = 'Entrar no Painel';
        googleLabel.innerText = 'Entrar com o Google';
      } else {
        tabNovo.className = "flex-1 py-2 rounded-lg bg-brand-900 text-white shadow-xs text-center transition-all";
        tabEntrar.className = "flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-900 text-center transition-all";
        fieldNome.classList.remove('hidden');
        btnText.innerText = 'Cadastrar & Acessar';
        googleLabel.innerText = 'Cadastrar com o Google';
      }
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      const icon = document.getElementById('toggle-password-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        passInput.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    const SUPABASE_URL = "https://tocyvysucpslayzglixq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_8mKUf28dbMM8EOSPrgjRUA_19taJmrT";
    let supabaseClient = null;

    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // Checa se o usuário acabou de voltar autenticado do Google OAuth
    async function checkGoogleCallback() {
      if (supabaseClient) {
        try {
          const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
          if (sessionError) throw sessionError;

          if (session && session.user) {
            const user = session.user;
            const userEmail = user.email || "";
            const userName = user.user_metadata?.full_name || user.user_metadata?.name || userEmail.split('@')[0];

            // Consulta perfil real no Supabase
            const { data: profile, error: profError } = await supabaseClient
              .from('profiles')
              .select('id, email, nome, role, plan_type, onboarding_completed')
              .eq('id', user.id)
              .single();

            const isSuperEmail = userEmail.includes('venancio') || userEmail === 'gamersilvaesilva@gmail.com' || userEmail.includes('leoserven');
            const userRole = (isSuperEmail || profile?.role === 'admin') ? 'admin' : (profile?.role || 'usuario');
            const userPlan = profile?.plan_type || 'gratis';
            const hasCompletedOnboarding = profile ? Boolean(profile.onboarding_completed) : false;

            localStorage.setItem('userName', profile?.nome || userName);
            localStorage.setItem('userEmail', userEmail);
            localStorage.setItem('userRole', userRole);
            localStorage.setItem('userPlan', userPlan);
            localStorage.setItem('authProvider', 'google');

            if (userRole === 'admin') {
              window.location.href = "admin-crm.html";
              return;
            }
            if (userRole === 'vendedor') {
              window.location.href = "painel-afiliado.html";
              return;
            }

            if (!hasCompletedOnboarding) {
              window.location.href = "formulario-radar.html";
            } else {
              window.location.href = "app.html";
            }
          }
        } catch (err) {
          console.warn("Nenhuma sessão de callback detectada ou erro:", err);
        }
      }
    }
    checkGoogleCallback();

    async function loginWithGoogle() {
      const btn = document.getElementById('btn-login');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i><span>Conectando ao Google...</span>';
      }

      if (!supabaseClient) {
        alert("Erro de conexão: Cliente de autenticação não inicializado.");
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-brands fa-google text-rose-500 text-lg"></i><span>Continuar com Google</span>';
        }
        return;
      }

      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + window.location.pathname
          }
        });
        if (error) throw error;
      } catch (err) {
        console.error("Erro no login com Google:", err);
        alert("Não foi possível conectar com o Google: " + (err.message || "Tente novamente mais tarde."));
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-brands fa-google text-rose-500 text-lg"></i><span>Continuar com Google</span>';
        }
      }
    }

    async function handleAuthSubmit(e) {
      if (e) {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        if (typeof e.stopPropagation === 'function') e.stopPropagation();
      }
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const nome = document.getElementById('nome')?.value?.trim();
      const isNewRegister = authMode === 'register';

      if (!email || !pass) {
        alert("Por favor, preencha todos os campos.");
        return false;
      }

      const submitBtn = document.querySelector("#auth-form button[type='submit']");
      const originalText = submitBtn ? submitBtn.innerHTML : '';
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i><span>Processando...</span>';
      }

      try {
        if (!supabaseClient) throw new Error("Cliente Supabase não disponível.");

        if (isNewRegister) {
          const { data: signUpData, error: signUpErr } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: { full_name: nome || email.split('@')[0] }
            }
          });
          if (signUpErr) throw signUpErr;

          localStorage.setItem('userEmail', email);
          localStorage.setItem('userName', nome || email.split('@')[0]);
          localStorage.setItem('userRole', 'usuario');
          localStorage.setItem('userPlan', 'gratis');
          window.location.href = "formulario-radar.html";
        } else {
          const { data: signInData, error: signInErr } = await supabaseClient.auth.signInWithPassword({
            email,
            password
          });
          if (signInErr) throw signInErr;

          const user = signInData.user;
          const { data: profile } = await supabaseClient
            .from('profiles')
            .select('id, email, nome, role, plan_type, onboarding_completed')
            .eq('id', user.id)
            .single();

          const isSuperUser = (user.email || '').toLowerCase().includes('venancio') || user.email === 'gamersilvaesilva@gmail.com' || (user.email || '').toLowerCase().includes('leoserven');
          const role = (isSuperUser || profile?.role === 'admin') ? 'admin' : (profile?.role || 'usuario');
          const plan = profile?.plan_type || 'gratis';
          const onboardingDone = profile ? Boolean(profile.onboarding_completed) : false;

          localStorage.setItem('userEmail', user.email);
          localStorage.setItem('userName', profile?.nome || user.user_metadata?.full_name || email.split('@')[0]);
          localStorage.setItem('userRole', role);
          localStorage.setItem('userPlan', plan);

          if (role === 'admin') {
            window.location.href = "admin-crm.html";
          } else if (role === 'vendedor') {
            window.location.href = "painel-afiliado.html";
          } else if (!onboardingDone) {
            window.location.href = "formulario-radar.html";
          } else {
            window.location.href = "app.html";
          }
        }
      } catch (err) {
        console.error("Erro na autenticação:", err);
        alert("Erro ao autenticar: " + (err.message || "Verifique suas credenciais."));
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
      }
      return false;
    }

    document.getElementById('year-current').innerText = new Date().getFullYear();
  </script>
</body>
</html>
