  <script>
    // Slideshow de Fundo Original com transição contínua
    let currentSlideIdx = 0;
    const slides = document.querySelectorAll(".login-bg-slide");
    if (slides && slides.length > 1) {
      setInterval(() => {
        slides[currentSlideIdx].classList.remove("active");
        currentSlideIdx = (currentSlideIdx + 1) % slides.length;
        slides[currentSlideIdx].classList.add("active");
      }, 4000);
    }

    let authMode = 'login';

    function setAuthMode(mode) {
      authMode = mode;
      const tabEntrar = document.getElementById('tabEntrarBtn');
      const tabNovo = document.getElementById('tabNovoBtn');
      const fieldNome = document.getElementById('field-nome');
      const btnText = document.getElementById('btn-login-text');
      const googleLabel = document.getElementById('googleBtnLabel');
      const registering = mode === 'register';
      const registrationProfile = document.getElementById('registration-profile');
      registrationProfile.hidden = registrationProfile.disabled = !registering;
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('password-confirm');
      document.getElementById('field-password-confirm').hidden = !registering;
      confirmPassword.disabled = !registering;
      confirmPassword.required = registering;
      confirmPassword.value = '';
      password.autocomplete = registering ? 'new-password' : 'current-password';
      if (registering) password.setAttribute('aria-describedby', 'registration-password-hint');
      else password.removeAttribute('aria-describedby');
      showLoginMessage('');

      if (mode === 'login') {
        tabEntrar.className = "flex-1 py-2 rounded-lg bg-brand-900 text-white shadow-xs text-center transition-all";
        tabNovo.className = "flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-900 text-center transition-all";
        fieldNome.classList.add('hidden');
        btnText.innerText = 'Entrar no Painel';
        googleLabel.innerText = 'Entrar com o Google';
      } else {
        tabNovo.className = "flex-1 py-2 rounded-lg bg-brand-900 text-white shadow-xs text-center transition-all";
        tabEntrar.className = "flex-1 py-2 rounded-lg text-slate-500 hover:text-slate-900 text-center transition-all";
        fieldNome.classList.remove('hidden');
        btnText.innerText = 'Cadastrar & Acessar';
        googleLabel.innerText = 'Cadastrar com o Google';
      }
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      const icon = document.getElementById('toggle-password-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        passInput.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    const { url: SUPABASE_URL, key: SUPABASE_ANON_KEY } = window.radarSupabaseConfig || {};
    let supabaseClient = null;

    if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // Checa se o usuário acabou de voltar autenticado do Google OAuth
    async function checkGoogleCallback() {
      if (window.location.hash && /type=recovery/i.test(window.location.hash)) return;
      if (supabaseClient) {
        try {
          const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
          if (sessionError) throw sessionError;

          if (session && session.user) {
            const user = session.user;
            const userEmail = user.email || "";
            const userName = user.user_metadata?.full_name || user.user_metadata?.name || userEmail.split('@')[0];

            // Consulta perfil real no Supabase
            const { data: profile, error: profError } = await supabaseClient
              .from('profiles')
              .select('id, email, nome, role, plan_type, onboarding_completed')
              .eq('id', user.id)
              .single();

            const isAdmin = user.app_metadata?.role === 'admin' || user.app_metadata?.is_admin === true;
            const userRole = isAdmin ? 'admin' : (profile?.role === 'vendedor' ? 'vendedor' : 'usuario');
            const userPlan = profile?.plan_type || 'gratis';

            localStorage.setItem('userName', profile?.nome || userName);
            localStorage.setItem('userEmail', userEmail);
            localStorage.setItem('userRole', userRole);
            localStorage.setItem('userPlan', userPlan);
            localStorage.setItem('authProvider', 'google');

            if (userRole === 'admin') {
              window.location.href = "admin-crm.html";
              return;
            }
            if (userRole === 'vendedor') {
              window.location.href = "painel-afiliado.html";
              return;
            }

            const accessState = await window.radarLegal.checkFirstAccess(supabaseClient, user);
            if (accessState.needsFirstAccess) {
              window.location.href = "primeiro-acesso.html";
            } else {
              window.location.href = "app.html";
            }
          }
        } catch (err) {
          console.warn("Nenhuma sessão de callback detectada ou erro:", err);
        }
      }
    }
    checkGoogleCallback();

    async function loginWithGoogle() {
      const btn = document.getElementById('btn-login');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i><span>Conectando ao Google...</span>';
      }

      if (!supabaseClient) {
        showLoginMessage("Não foi possível conectar. Tente novamente em instantes.");
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-brands fa-google text-rose-500 text-lg"></i><span>Continuar com Google</span>';
        }
        return;
      }

      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + window.location.pathname
          }
        });
        if (error) throw error;
      } catch (err) {
        console.error("Erro no login com Google:", err);
        showLoginMessage("Não foi possível conectar com o Google. Tente novamente.");
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-brands fa-google text-rose-500 text-lg"></i><span>Continuar com Google</span>';
        }
      }
    }

    function registrationPasswordError(password, confirmation) {
      const missing = [];
      if (Array.from(password).length < 9) missing.push('pelo menos 9 caracteres');
      if (!/\p{N}/u.test(password)) missing.push('um número');
      if (!/\p{Lu}/u.test(password)) missing.push('uma letra maiúscula');
      if (!/[\p{P}\p{S}]/u.test(password)) missing.push('um caractere especial');
      if (missing.length) return 'A senha precisa ter ' + new Intl.ListFormat('pt-BR').format(missing) + '.';
      const compact = password.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
      if (!compact || /^\p{N}+$/u.test(compact) || /^(?<part>.{1,8})\k<part>+$/u.test(compact) ||
          /^(?:senha|password|qwerty|abc123|radarsaojose)\d*$/u.test(compact) ||
          'abcdefghijklmnopqrstuvwxyz'.includes(compact) || 'zyxwvutsrqponmlkjihgfedcba'.includes(compact)) {
        return 'Essa senha é fácil de adivinhar. Escolha uma frase longa com palavras diferentes.';
      }
      if (password !== confirmation) return 'As senhas precisam ser iguais.';
      return '';
    }

    const confirmationHelp = document.getElementById('confirmation-help');
    const resendButton = document.getElementById('resend-confirmation');
    const confirmationStatus = document.getElementById('confirmation-status');
    const emailField = document.getElementById('email');
    let pendingConfirmationEmail = '';
    let resendInProgress = false;
    let resendAvailableAt = 0;

    function confirmationRedirectUrl() {
      return new URL("primeiro-acesso.html?confirmacao=1", window.location.href).href;
    }

    function updateResendButton() {
      const waiting = Date.now() < resendAvailableAt;
      resendButton.disabled = resendInProgress || waiting;
      resendButton.textContent = resendInProgress ? 'Reenviando…' :
        waiting ? 'Aguarde para reenviar' : 'Reenviar e-mail de confirmação';
    }

    emailField.addEventListener('input', () => {
      if (pendingConfirmationEmail) showLoginMessage('');
    });

    resendButton.addEventListener('click', async () => {
      const email = pendingConfirmationEmail;
      if (!email || authMode !== 'login' || emailField.value.trim() !== email ||
          resendInProgress || Date.now() < resendAvailableAt) return;

      resendInProgress = true;
      updateResendButton();
      confirmationStatus.textContent = 'Solicitando reenvio…';
      let feedback = 'Não foi possível reenviar agora. Tente novamente em instantes.';
      try {
        const { error } = await supabaseClient.auth.resend({
          type: 'signup',
          email,
          options: { emailRedirectTo: confirmationRedirectUrl() }
        });
        if (error) throw error;
        feedback = 'Reenvio solicitado. Confira sua caixa de entrada e a pasta de spam ou lixo eletrônico.';
        resendAvailableAt = Date.now() + 60000;
      } catch (error) {
        if (error?.status === 429 || error?.code === 'over_email_send_rate_limit') {
          feedback = 'Aguarde pelo menos um minuto antes de pedir outro e-mail.';
          resendAvailableAt = Date.now() + 60000;
        }
      } finally {
        resendInProgress = false;
        updateResendButton();
        if (resendAvailableAt > Date.now()) {
          setTimeout(updateResendButton, resendAvailableAt - Date.now() + 10);
        }
        if (pendingConfirmationEmail === email) confirmationStatus.textContent = feedback;
      }
    });

    function showLoginMessage(message, type = 'error') {
      pendingConfirmationEmail = '';
      confirmationHelp.classList.add('hidden');
      confirmationStatus.textContent = '';
      const notice = document.getElementById('login-error-alert');
      if (!notice) return;
      const isError = Boolean(message) && type === 'error';
      notice.textContent = message;
      notice.classList.toggle('hidden', !message);
      notice.classList.toggle('text-red-800', isError);
      notice.classList.toggle('border-red-300', isError);
    }

    async function handleAuthSubmit(e) {
      if (e) {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        if (typeof e.stopPropagation === 'function') e.stopPropagation();
      }
      const email = document.getElementById('email')?.value?.trim() || '';
      const password = document.getElementById('password')?.value || '';
      const nome = document.getElementById('nome')?.value?.trim() || '';
      const isNewRegister = authMode === 'register';
      if (isNewRegister && nome.length < 2) {
        showLoginMessage('Informe seu nome completo.');
        return false;
      }

      if (!email || !password) {
        showLoginMessage("Preencha o e-mail e a senha.");
        return false;
      }

      showLoginMessage('');
      if (isNewRegister) {
        const profile = document.getElementById('register-profile');
        if (!profile.value || !document.getElementById('register-terms').checked) {
          showLoginMessage('Escolha seu perfil e aceite os termos para continuar.');
          return false;
        }
        const confirmation = document.getElementById('password-confirm').value;
        const message = registrationPasswordError(password, confirmation);
        if (message) {
          showLoginMessage(message);
          return false;
        }
      }

      const submitBtn = document.getElementById('btn-login');
      const originalText = submitBtn ? submitBtn.innerHTML : '';
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i><span>Processando...</span>';
      }

      try {
        if (!supabaseClient) throw new Error("Cliente Supabase não disponível.");

        if (isNewRegister) {
          const acceptedAt = new Date().toISOString();
          const selectedProfile = document.getElementById('register-profile').value;
          const { data: signUpData, error: signUpErr } = await supabaseClient.auth.signUp({
            email,
            password: String(password),
            options: {
              emailRedirectTo: confirmationRedirectUrl(),
              data: {
                full_name: nome,
                radar_full_name: nome,
                radar_profile_type: selectedProfile,
                radar_terms_acceptance: {
                  version: window.radarLegal.version,
                  accepted_at: acceptedAt
                }
              }
            }
          });
          if (signUpErr) throw signUpErr;

          if (signUpData?.session?.user) {
            await window.radarLegal.recordAcceptance(supabaseClient, signUpData.session.user, {
              terms_version: window.radarLegal.version,
              accepted_at: acceptedAt,
              profile_type: selectedProfile
            });
          }

          localStorage.setItem('userEmail', email);
          localStorage.setItem('userName', nome || email.split('@')[0]);
          localStorage.setItem('userRole', 'usuario');
          localStorage.setItem('userPlan', 'gratis');
          if (!signUpData?.session) {
            window.location.href = "app.html?primeiraVisita=1#historia";
            return;
          }
          window.location.href = "primeiro-acesso.html";
        } else {
          const { data: signInData, error: signInErr } = await supabaseClient.auth.signInWithPassword({
            email,
            password: String(password)
          });
          if (signInErr) throw signInErr;

          const user = signInData.user;
          const { data: profile } = await supabaseClient
            .from('profiles')
            .select('id, email, nome, role, plan_type, onboarding_completed')
            .eq('id', user.id)
            .single();

          const isAdmin = user.app_metadata?.role === 'admin' || user.app_metadata?.is_admin === true;
          const role = isAdmin ? 'admin' : (profile?.role === 'vendedor' ? 'vendedor' : 'usuario');
          const plan = profile?.plan_type || 'gratis';

          localStorage.setItem('userEmail', user.email);
          localStorage.setItem('userName', profile?.nome || user.user_metadata?.full_name || email.split('@')[0]);
          localStorage.setItem('userRole', role);
          localStorage.setItem('userPlan', plan);

          if (role === 'admin') {
            window.location.href = "admin-crm.html";
          } else if (role === 'vendedor') {
            window.location.href = "painel-afiliado.html";
          } else {
            const accessState = await window.radarLegal.checkFirstAccess(supabaseClient, user);
            if (accessState.needsFirstAccess) {
              window.location.href = "primeiro-acesso.html";
            } else {
              window.location.href = "app.html";
            }
          }
        }
      } catch (err) {
        console.error("Erro na autenticação:", err);
        if (!isNewRegister && err?.code === "email_not_confirmed" &&
            authMode === 'login' && emailField.value.trim() === email) {
          showLoginMessage("Para entrar, confirme seu e-mail. Se não encontrar a mensagem na caixa de entrada, confira também o spam ou lixo eletrônico.");
          pendingConfirmationEmail = email;
          updateResendButton();
          confirmationHelp.classList.remove('hidden');
        } else {
          showLoginMessage(isNewRegister ? "Não foi possível criar a conta. Confira os dados e tente novamente."
          : "Não foi possível entrar. Confira o e-mail e a senha.");
        }
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
      }
      return false;
    }

    document.getElementById('year-current').innerText = new Date().getFullYear();
    if (new URLSearchParams(window.location.search).get('cadastro') === '1') setAuthMode('register');
  </script>
</body>
