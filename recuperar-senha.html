<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Recuperar senha | Radar São José</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; color: #0b2545; background: linear-gradient(#07172c99, #07172ce6), url('web-media/foto_onibus_viaduto-18691779619a.webp') center / cover; font: 1rem/1.5 system-ui, sans-serif; }
    main { width: min(100%, 440px); padding: clamp(20px, 6vw, 36px); border-radius: 24px; background: white; box-shadow: 0 20px 60px #0006; }
    img { display: block; height: 64px; max-width: 100%; object-fit: contain; margin: 0 auto; }
    h1 { font-size: 1.65rem; }
    label { display: block; margin-top: 12px; font-weight: 650; }
    input, button { display: block; width: 100%; margin-top: 6px; padding: 11px; border: 1px solid #94a3b8; border-radius: 9px; font: inherit; }
    button { margin-top: 16px; background: #0b2545; border-color: #0b2545; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; }
    a { color: #075985; }
    #status:empty { display: none; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/api/asaas-checkout?browserConfig=1"></script>
  <script defer src="/supabase-browser-config.js"></script>
</head>
<body>
  <main>
    <img src="fotos_radar/logo_login_radar.png?v=20261105" alt="Radar São José">
    <h1 id="title">Recuperar senha</h1>
    <form id="request" hidden>
      <p id="request-description">Informe o e-mail da sua conta para receber um link de recuperação.</p>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button type="submit">Enviar link</button>
    </form>
    <form id="update" hidden>
      <label for="password">Nova senha</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="9" required>
      <small>Use pelo menos 9 caracteres, com letra maiúscula, número e símbolo.</small>
      <label for="confirm">Confirme a nova senha</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="9" required>
      <button type="submit">Salvar nova senha</button>
    </form>
    <p id="status" role="status">Carregando…</p>
    <p><a href="login.html">Voltar ao login</a> <span id="retry" hidden>· <a href="recuperar-senha.html">Pedir outro link</a></span></p>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const request = document.getElementById("request");
      const update = document.getElementById("update");
      const status = document.getElementById("status");
      const mode = new URLSearchParams(location.search).get("modo");
      const recovery = mode === "redefinir";
      const confirmation = mode === "confirmar";
      const { url, key } = window.radarSupabaseConfig || {};
      if (!url || !key || !window.supabase) {
        status.textContent = "Não foi possível conectar. Tente novamente em instantes.";
        return;
      }

      const client = window.supabase.createClient(url, key);
      if (!recovery) {
        if (confirmation) {
          document.getElementById("title").textContent = "Reenviar confirmação";
          document.getElementById("request-description").textContent = "Informe o e-mail usado no cadastro.";
        }
        request.hidden = false;
        status.textContent = "";
        request.addEventListener("submit", async event => {
          event.preventDefault();
          const button = request.querySelector("button");
          if (button.disabled) return;
          button.disabled = true;
          status.textContent = "Solicitando o link…";
          try {
            const email = request.elements.email.value.trim();
            const { error } = confirmation
              ? await client.auth.resend({
                  type: "signup",
                  email,
                  options: { emailRedirectTo: new URL("login.html", location.href).href }
                })
              : await client.auth.resetPasswordForEmail(email, {
                  redirectTo: new URL("recuperar-senha.html?modo=redefinir", location.href).href
                });
            if (error && !(error.status >= 400 && error.status < 500)) throw error;
            status.textContent = "Se o endereço estiver apto a receber este link, ele chegará por e-mail. Confira também a caixa de spam.";
          } catch {
            status.textContent = "Não foi possível solicitar o link agora. Tente novamente.";
          } finally {
            button.disabled = false;
          }
        });
        return;
      }

      let recoveryUserId;
      const recoveryWait = setTimeout(() => {
        status.textContent = "Não foi possível confirmar o link. Você pode solicitar outro.";
        document.getElementById("retry").hidden = false;
      }, 5000);
      client.auth.onAuthStateChange((event, session) => {
        if (event !== "PASSWORD_RECOVERY" || !session?.user) return;
        clearTimeout(recoveryWait);
        recoveryUserId = session.user.id;
        document.getElementById("title").textContent = "Criar nova senha";
        document.getElementById("retry").hidden = true;
        update.hidden = false;
        status.textContent = "";
      });
      client.auth.getSession().catch(() => {});

      update.addEventListener("submit", async event => {
        event.preventDefault();
        const button = update.querySelector("button");
        const password = update.elements.password.value;
        if (!recoveryUserId || button.disabled) return;
        if (Array.from(password).length < 9 || !/[A-ZÀ-Ý]/.test(password) || !/\d/.test(password) || !/[^\p{L}\p{N}\s]/u.test(password)) {
          status.textContent = "Use pelo menos 9 caracteres, com letra maiúscula, número e símbolo.";
          return;
        }
        if (password !== update.elements.confirm.value) {
          status.textContent = "As senhas precisam ser iguais.";
          return;
        }
        button.disabled = true;
        status.textContent = "Salvando a nova senha…";
        try {
          const { data } = await client.auth.getSession();
          if (data.session?.user?.id !== recoveryUserId) throw new Error("Sessão de recuperação inválida");
          const { error } = await client.auth.updateUser({ password });
          if (error) throw error;
          update.reset();
          update.hidden = true;
          recoveryUserId = undefined;
          status.textContent = "Senha atualizada. Volte ao login para continuar.";
          await client.auth.signOut({ scope: "global" }).catch(() => {});
        } catch {
          status.textContent = "Não foi possível alterar a senha. Tente novamente ou solicite outro link.";
          document.getElementById("retry").hidden = false;
        } finally {
          button.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
